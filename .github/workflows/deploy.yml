name: Deploy Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Deploy to /opt/fragma-bot
        run: |
          sudo rsync -avz --delete --exclude '.git' --exclude '.env' ./ /opt/fragma-bot/

      - name: Restart Fragma Bot Service
        run: sudo systemctl restart fragma-bot.service
